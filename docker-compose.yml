services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./qme:/app/qme
    depends_on:
      - kafka
      - mongo
      - redis
      - postgres
      - minio
    networks:
      - sokogate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - api
    networks:
      - sokogate-network

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - sokogate-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sokogate-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sokogate-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sokogate
      POSTGRES_PASSWORD: sokogate
      POSTGRES_DB: sokogate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sokogate-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - sokogate-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sokogate_access
      MINIO_ROOT_PASSWORD: sokogate_secret_key_change_in_production
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sokogate-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api
    networks:
      - sokogate-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=sokogate
      - GF_SECURITY_ADMIN_PASSWORD=sokogate_admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sokogate-network

volumes:
  mongo_data:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  sokogate-network:
    driver: bridge
