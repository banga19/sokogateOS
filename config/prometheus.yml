# Prometheus Configuration for SokogateOS Monitoring
# ──────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093  # Uncomment when AlertManager is deployed

# Rule files to load (create config/alerts.yml for alerting rules)
# rule_files:
#   - 'alerts.yml'

# Scrape targets
scrape_configs:
  # API metrics
  - job_name: 'sokogateos-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 10s
    # Basic health check
    metrics_relabel_configs:
      - source_labels: [__name__]
        regex: '(go_.*|nodejs_.*|http_.*)'
        action: keep

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Node exporter (host metrics) — add if running node_exporter
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # Docker daemon metrics
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['docker:9323']
