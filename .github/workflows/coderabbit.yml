name: Coderabbit Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

concurrency:
  group: coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Coderabbit PR review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: echo "Coderabbit review runs as a GitHub App — no extra action required"
